services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sport
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d sport"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # Cache only: no persistent storage. Restart discards all cached values.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/sport
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080,http://localhost:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GEO_CONTACT_EMAIL: ${GEO_CONTACT_EMAIL:-}
      GEO_USER_AGENT: ${GEO_USER_AGENT:-Sportik/1.0}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SEED_MOCK_DATA: ${SEED_MOCK_DATA:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment: *backend_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - avatars_data:/data/avatars
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
  avatars_data:
